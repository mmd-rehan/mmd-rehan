<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="1" />
      <stop offset="60%" stop-color="#070a12" stop-opacity="1" />
      <stop offset="100%" stop-color="#030508" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emerald-glow" cx="70%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-glow); }
    .grid-pattern { opacity: 0.12; stroke: #38bdf8; stroke-width: 0.5; stroke-dasharray: 4 4; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: url(#title-grad); letter-spacing: 2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 15px; fill: #38bdf8; letter-spacing: 4px; text-transform: uppercase; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 17px; fill: #94a3b8; letter-spacing: 0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #e2e8f0; letter-spacing: 1px; }

    /* Keyframe Animations for Sprinkle Particles */
    @keyframes float1 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-18px) translateX(10px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }

    @keyframes float2 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(15px) translateX(-12px); opacity: 1; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.4); }
    }

    @keyframes line-slide {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes status-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .p-group-1 { animation: float1 6s ease-in-out infinite; }
    .p-group-2 { animation: float2 8s ease-in-out infinite; }
    .p-group-3 { animation: float1 10s ease-in-out infinite reverse; }
    .p-pulse { animation: pulse 4s ease-in-out infinite; }
    .status-dot { animation: status-blink 2s ease-in-out infinite; fill: #34d399; }
  </style>

  <!-- Background Layer -->
  <rect width="1000" height="340" class="bg" rx="16" />
  <rect width="1000" height="340" fill="url(#cyan-glow)" rx="16" />
  <rect width="1000" height="340" fill="url(#emerald-glow)" rx="16" />

  <!-- Cyber Grid Overlay -->
  <g class="grid-pattern">
    <path d="M 0,40 L 1000,40 M 0,80 L 1000,80 M 0,120 L 1000,120 M 0,160 L 1000,160 M 0,200 L 1000,200 M 0,240 L 1000,240 M 0,280 L 1000,280 M 0,320 L 1000,320" />
    <path d="M 100,0 L 100,340 M 200,0 L 200,340 M 300,0 L 300,340 M 400,0 L 400,340 M 500,0 L 500,340 M 600,0 L 600,340 M 700,0 L 700,340 M 800,0 L 800,340 M 900,0 L 900,340" />
  </g>

  <!-- Constellation Lines -->
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.25">
    <line x1="120" y1="60" x2="240" y2="110" />
    <line x1="240" y1="110" x2="180" y2="220" />
    <line x1="180" y1="220" x2="90" y2="180" />
    <line x1="820" y1="70" x2="910" y2="140" />
    <line x1="910" y1="140" x2="840" y2="250" />
    <line x1="840" y1="250" x2="760" y2="180" />
  </g>

  <!-- Animated Sprinkle Particles (Group 1 - Cyan) -->
  <g class="p-group-1" fill="#38bdf8">
    <circle cx="120" cy="60" r="3.5" filter="url(#glow)" />
    <circle cx="240" cy="110" r="2.5" />
    <circle cx="180" cy="220" r="3" filter="url(#glow)" />
    <circle cx="90" cy="180" r="2" />
    <circle cx="310" cy="50" r="1.5" />
    <circle cx="720" cy="90" r="3" filter="url(#glow)" />
    <circle cx="820" cy="70" r="4" filter="url(#glow)" />
    <circle cx="910" cy="140" r="2.5" />
    <circle cx="840" cy="250" r="3.5" filter="url(#glow)" />
    <circle cx="760" cy="180" r="2" />
  </g>

  <!-- Animated Sprinkle Particles (Group 2 - Emerald & Gold) -->
  <g class="p-group-2">
    <circle cx="150" cy="140" r="2" fill="#34d399" />
    <circle cx="280" cy="260" r="3" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="70" cy="280" r="2.5" fill="#34d399" />
    <circle cx="880" cy="200" r="3" fill="#34d399" filter="url(#glow)" />
    <circle cx="940" cy="80" r="2" fill="#fbbf24" />
    <circle cx="650" cy="40" r="2.5" fill="#38bdf8" />
    <circle cx="400" cy="290" r="2" fill="#34d399" />
  </g>

  <!-- Animated Sprinkle Particles (Group 3 - Ambient Dust) -->
  <g class="p-group-3" fill="#ffffff" opacity="0.6">
    <circle cx="210" cy="80" r="1" />
    <circle cx="100" cy="110" r="1.5" />
    <circle cx="260" cy="190" r="1" />
    <circle cx="790" cy="120" r="1.5" />
    <circle cx="870" cy="290" r="1" />
    <circle cx="620" cy="300" r="1.5" />
    <circle cx="360" cy="280" r="1" />
  </g>

  <!-- Pulsing Central Embers -->
  <g class="p-pulse">
    <circle cx="500" cy="45" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="140" cy="240" r="5" fill="#34d399" filter="url(#glow)" />
    <circle cx="860" cy="110" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Glowing Header Content Box -->
  <g transform="translate(50, 45)">
    <!-- Top Status Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="410" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="18" cy="14" r="4" class="status-dot" filter="url(#glow)" />
      <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">SOFTWARE ENGINEER &amp; FULL-STACK DEVELOPER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="72" class="title">MUHAMMAD REHAN</text>
    <text x="0" y="96" class="subtitle">DUBAI, UAE · 7+ YEARS SOFTWARE ENGINEERING</text>

    <!-- Glowing Accent Line -->
    <line x1="0" y1="114" x2="900" y2="114" stroke="url(#line-grad)" stroke-width="2" />

    <!-- Tagline -->
    <text x="0" y="146" class="tagline">"I build an industry nervous system - wiring Healthcare, Aviation, Crypto &amp; Logistics."</text>

    <!-- Domain Pills / Badges -->
    <g transform="translate(0, 175)">
      <!-- Health -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="20" cy="17" r="4" fill="#38bdf8" />
        <text x="34" y="21" class="badge-text">🩺 HEALTHCARE EMR</text>
      </g>
      <!-- Aviation -->
      <g transform="translate(195, 0)">
        <rect width="180" height="34" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="20" cy="17" r="4" fill="#34d399" />
        <text x="34" y="21" class="badge-text">✈️ AVIATION SYSTEMS</text>
      </g>
      <!-- Crypto -->
      <g transform="translate(390, 0)">
        <rect width="210" height="34" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="20" cy="17" r="4" fill="#fbbf24" />
        <text x="34" y="21" class="badge-text">⚡ 300K+ MINER CRYPTO</text>
      </g>
      <!-- Logistics -->
      <g transform="translate(615, 0)">
        <rect width="185" height="34" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="20" cy="17" r="4" fill="#a855f7" />
        <text x="34" y="21" class="badge-text">🚢 GLOBAL LOGISTICS</text>
      </g>
    </g>
  </g>
</svg>
