<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" height="100%">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="div-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes move-p1 {
      0% { transform: translateX(0px); opacity: 0.2; }
      50% { opacity: 1; }
      100% { transform: translateX(600px); opacity: 0; }
    }
    @keyframes move-p2 {
      0% { transform: translateX(0px); opacity: 0.2; }
      50% { opacity: 1; }
      100% { transform: translateX(-600px); opacity: 0; }
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.6); opacity: 0.9; }
    }

    .p-left { animation: move-p1 7s linear infinite; }
    .p-right { animation: move-p2 7s linear infinite; }
    .ring { transform-origin: 500px 15px; animation: pulse-ring 3s ease-in-out infinite; }
  </style>

  <!-- Divider Line -->
  <line x1="50" y1="15" x2="950" y2="15" stroke="url(#div-grad)" stroke-width="1.5" />

  <!-- Center Pulse Ring -->
  <circle cx="500" cy="15" r="7" fill="none" stroke="#34d399" stroke-width="1" class="ring" />
  <circle cx="500" cy="15" r="3.5" fill="#38bdf8" filter="url(#div-glow)" />

  <!-- Animated Sprinkles along Line -->
  <g class="p-left">
    <circle cx="200" cy="15" r="2" fill="#38bdf8" filter="url(#div-glow)" />
    <circle cx="350" cy="15" r="1.5" fill="#34d399" />
  </g>

  <g class="p-right">
    <circle cx="800" cy="15" r="2" fill="#a855f7" filter="url(#div-glow)" />
    <circle cx="650" cy="15" r="1.5" fill="#fbbf24" />
  </g>
</svg>
